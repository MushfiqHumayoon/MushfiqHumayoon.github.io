<style>
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
/* Layout: one dark stage; giant variable-width name reacts to the cursor, work cards carry live generative motifs, everything else stays quiet. */
:root {
  --ink: #07080d;
  --stage: #0d1018;
  --line: #1d2230;
  --fg: #e8ebf2;
  --dim: #8c93a6;
  --signal: #5be9ff;
  --signal-ink: #04161b;
  --display: "Anybody", "Arial Narrow", system-ui, sans-serif;
  --body: "Hanken Grotesk", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --gutter: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  --max: 1240px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background: var(--ink);
  color: var(--fg);
  font: 400 16px/1.6 var(--body);
  overflow-x: clip;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 60; background: var(--ink);
}
a { color: inherit; }
::selection { background: var(--signal); color: var(--signal-ink); }
:focus-visible { outline: 2px solid var(--signal); outline-offset: 3px; border-radius: 4px; }

.wrap {
  max-width: calc(var(--max) + 64px);
  margin-inline: auto;
  padding-left: var(--gutter);
  padding-right: var(--gutter-r);
}
@media (min-width: 720px) { .wrap { padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px)); } }

.label {
  font: 500 12px/1 var(--mono);
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--dim);
}

/* ---------- nav ---------- */
.nav {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50;
  background: color-mix(in srgb, var(--ink) 78%, transparent);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
}
.nav .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; height: 60px; }
.mark { font: 800 18px/1 var(--display); font-variation-settings: "wdth" 120; text-decoration: none; letter-spacing: .01em; }
.mark span { color: var(--signal); }
.nav ul { display: flex; gap: 28px; list-style: none; margin: 0; padding: 0; }
.nav ul a { text-decoration: none; font: 500 13px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--dim); transition: color .2s; }
.nav ul a:hover { color: var(--fg); }
.status { display: inline-flex; align-items: center; gap: 8px; font: 500 12px/1 var(--mono); color: var(--fg); padding: 8px 12px; border: 1px solid var(--line); border-radius: 99px; white-space: nowrap; }
.status i { width: 7px; height: 7px; border-radius: 50%; background: var(--signal); box-shadow: 0 0 0 0 var(--signal); animation: ping 2.4s infinite; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--signal) 60%, transparent); } 70%,100% { box-shadow: 0 0 0 9px transparent; } }
@media (max-width: 760px) { .nav ul { display: none; } }

/* ---------- hero ---------- */
.hero { position: relative; overflow: clip; border-bottom: 1px solid var(--line); }
.hero canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.hero .wrap { position: relative; padding-block: clamp(56px, 10vw, 120px) clamp(40px, 6vw, 72px); display: grid; gap: clamp(28px, 4vw, 48px); }
.hero-top { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
.hero-name {
  margin: 0;
  font-family: var(--display);
  font-size: clamp(52px, 13.5vw, 196px);
  line-height: .84;
  letter-spacing: -.01em;
  text-transform: uppercase;
  user-select: none;
}
.hero-name .row { display: block; white-space: nowrap; }
.hero-name .ch {
  display: inline-block;
  --w: 100; --g: 780;
  font-variation-settings: "wdth" var(--w), "wght" var(--g);
  transition: font-variation-settings .35s cubic-bezier(.2,.8,.2,1), color .35s;
  animation: stretch-in 1.1s cubic-bezier(.16,1,.3,1) backwards;
  animation-delay: calc(var(--i) * 45ms + 150ms);
}
.hero-name .row + .row .ch { color: transparent; -webkit-text-stroke: 1.5px var(--fg); }
.hero-name .ch.hot { color: var(--signal); -webkit-text-stroke-color: var(--signal); }
@keyframes stretch-in {
  from { font-variation-settings: "wdth" 50, "wght" 100; transform: translateY(.25em); opacity: 0; }
  60% { opacity: 1; }
  to { font-variation-settings: "wdth" 100, "wght" 780; transform: none; }
}
.hero-bottom { display: grid; grid-template-columns: 1.3fr 1fr; gap: 32px; align-items: end; }
.role { font: 500 clamp(20px, 2.4vw, 30px)/1.25 var(--body); margin: 0; max-width: 30ch; text-wrap: balance; }
.role .swap { display: inline-grid; vertical-align: bottom; height: 1.25em; overflow: hidden; color: var(--signal); }
.role .swap span { grid-area: 1/1; transform: translateY(110%); transition: transform .6s cubic-bezier(.7,0,.2,1); white-space: nowrap; }
.role .swap span.on { transform: none; }
.role .swap span.off { transform: translateY(-110%); }
.stats { display: flex; gap: clamp(20px, 3vw, 44px); justify-content: flex-end; flex-wrap: wrap; }
.stat b { display: block; font: 800 clamp(32px, 4vw, 52px)/1 var(--display); font-variation-settings: "wdth" 70; font-variant-numeric: tabular-nums; }
.stat b em { font-style: normal; color: var(--signal); }
@media (max-width: 760px) { .hero-bottom { grid-template-columns: 1fr; } .stats { justify-content: flex-start; } }

/* ---------- marquee ---------- */
.marquee { border-bottom: 1px solid var(--line); overflow: hidden; padding-block: 18px; display: grid; gap: 10px; }
.marquee .track { display: flex; width: max-content; will-change: transform; }
.marquee .track span {
  font: 700 clamp(28px, 4.6vw, 60px)/1 var(--display);
  font-variation-settings: "wdth" 130, "wght" 700;
  text-transform: uppercase; padding-inline: .45em; white-space: nowrap;
  display: inline-flex; align-items: center; gap: .9em;
}
.marquee .track span::after { content: ""; width: .28em; height: .28em; background: var(--signal); transform: rotate(45deg); }
.marquee .track.alt span { color: transparent; -webkit-text-stroke: 1px var(--dim); font-variation-settings: "wdth" 60, "wght" 500; }
.marquee .track.alt span::after { background: transparent; border: 1px solid var(--dim); }

/* ---------- sections ---------- */
section.block { padding-block: clamp(72px, 10vw, 140px); border-bottom: 1px solid var(--line); }
.head { display: flex; justify-content: space-between; align-items: end; gap: 24px; flex-wrap: wrap; margin-bottom: clamp(36px, 5vw, 64px); }
.head h2 {
  margin: 0;
  font: 800 clamp(44px, 7vw, 104px)/.9 var(--display);
  font-variation-settings: "wdth" 62, "wght" 800;
  text-transform: uppercase; text-wrap: balance;
  transition: font-variation-settings .6s cubic-bezier(.2,.8,.2,1);
}
.head:hover h2 { font-variation-settings: "wdth" 110, "wght" 800; }
.head p { margin: 0; max-width: 42ch; color: var(--dim); }

/* ---------- work ---------- */
.work { display: grid; grid-template-columns: repeat(12, 1fr); gap: clamp(14px, 2vw, 24px); }
.card {
  grid-column: span 6;
  position: relative; display: grid; grid-template-rows: auto 1fr;
  background: var(--stage); border: 1px solid var(--line); border-radius: 18px; overflow: hidden;
  text-decoration: none; isolation: isolate;
  transition: border-color .3s, transform .5s cubic-bezier(.2,.8,.2,1);
  transform: perspective(1000px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
}
.card:hover { border-color: color-mix(in srgb, var(--signal) 55%, var(--line)); }
.card.wide { grid-column: span 12; }
.card.wide .art { aspect-ratio: 21 / 8; }
.card.third { grid-column: span 4; }
.art { position: relative; aspect-ratio: 16 / 10; background: radial-gradient(120% 90% at 30% 20%, #121827, var(--stage)); border-bottom: 1px solid var(--line); max-width: 100%; }
.art canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.art .yr { position: absolute; top: 16px; left: 18px; }
.art .go {
  position: absolute; top: 14px; right: 14px; width: 40px; height: 40px; border-radius: 50%;
  display: grid; place-items: center; background: var(--fg); color: var(--ink);
  transform: scale(.6) rotate(-45deg); opacity: 0; transition: transform .45s cubic-bezier(.2,.8,.2,1), opacity .3s;
}
.card:hover .go, .card:focus-visible .go { transform: none; opacity: 1; }
.meta { padding: 20px 22px 24px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.meta h3 { margin: 0; font: 700 clamp(24px, 2.6vw, 34px)/1 var(--display); font-variation-settings: "wdth" 85, "wght" 700; transition: font-variation-settings .45s cubic-bezier(.2,.8,.2,1); }
.card:hover .meta h3 { font-variation-settings: "wdth" 125, "wght" 750; }
.meta p { margin: 0; color: var(--dim); max-width: 60ch; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.tag { font: 500 11px/1 var(--mono); letter-spacing: .06em; padding: 7px 10px; border: 1px solid var(--line); border-radius: 99px; color: var(--fg); }
.role-line { font: 500 12px/1.4 var(--mono); color: var(--signal); letter-spacing: .04em; }
@media (max-width: 900px) { .card, .card.third { grid-column: span 12; } .card.wide .art { aspect-ratio: 16 / 10; } }

/* ---------- skills ---------- */
.skills { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
.skill { background: var(--ink); padding: clamp(22px, 3vw, 36px); display: grid; gap: 18px; align-content: start; min-width: 0; transition: background .3s; }
.skill:hover { background: var(--stage); }
.skill h3 { margin: 0; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; font: 700 28px/1 var(--display); font-variation-settings: "wdth" 110, "wght" 700; text-transform: uppercase; }
.skill h3 small { font: 500 12px/1 var(--mono); color: var(--dim); letter-spacing: .1em; }
.skill p { margin: 0; color: var(--dim); }
.skill ul { list-style: none; margin: 0; padding: 0; display: grid; }
.skill li { display: flex; justify-content: space-between; gap: 12px; padding-block: 11px; border-top: 1px solid var(--line); font-weight: 500; }
.skill li span { font: 400 12px/1.6 var(--mono); color: var(--dim); font-variant-numeric: tabular-nums; }
@media (max-width: 900px) { .skills { grid-template-columns: 1fr; } }

/* ---------- about / timeline ---------- */
.about { display: grid; grid-template-columns: 1fr 1.15fr; gap: clamp(32px, 6vw, 96px); }
.about .lede { font: 500 clamp(22px, 2.5vw, 32px)/1.3 var(--body); margin: 0 0 20px; text-wrap: balance; max-width: 26ch; }
.about .lede em { font-style: normal; color: var(--signal); }
.about .copy p { color: var(--dim); max-width: 52ch; margin: 0 0 14px; }
.timeline { list-style: none; margin: 0; padding: 0; border-left: 1px solid var(--line); }
.timeline li { position: relative; padding: 0 0 34px 28px; display: grid; gap: 6px; }
.timeline li:last-child { padding-bottom: 0; }
.timeline li::before { content: ""; position: absolute; left: -5px; top: 6px; width: 9px; height: 9px; border-radius: 50%; background: var(--ink); border: 1px solid var(--dim); transition: background .3s, border-color .3s; }
.timeline li:first-child::before { background: var(--signal); border-color: var(--signal); }
.timeline li:hover::before { border-color: var(--signal); }
.timeline .when { font: 500 12px/1 var(--mono); color: var(--dim); letter-spacing: .08em; font-variant-numeric: tabular-nums; }
.timeline h3 { margin: 0; font: 700 22px/1.15 var(--display); font-variation-settings: "wdth" 95, "wght" 700; }
.timeline h3 span { color: var(--dim); font-weight: 500; }
.timeline p { margin: 0; color: var(--dim); max-width: 52ch; }
@media (max-width: 900px) { .about { grid-template-columns: 1fr; } }

/* ---------- contact ---------- */
.contact { padding-block: clamp(80px, 12vw, 160px) clamp(40px, 5vw, 64px); }
.big {
  margin: 0 0 clamp(32px, 4vw, 56px);
  font: 800 clamp(52px, 11vw, 168px)/.86 var(--display);
  text-transform: uppercase; text-wrap: balance;
}
.big span { display: inline-block; font-variation-settings: "wdth" 60, "wght" 800; transition: font-variation-settings .7s cubic-bezier(.2,.8,.2,1), color .4s; }
.big:hover span { font-variation-settings: "wdth" 115, "wght" 850; }
.big span.accent { color: var(--signal); }
.reach { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 18px; }
.email {
  font: 500 clamp(18px, 2.2vw, 26px)/1.2 var(--body);
  padding: 16px 22px; border: 1px solid var(--line); border-radius: 99px;
  user-select: all; overflow-wrap: anywhere; min-width: 0;
}
.btn {
  appearance: none; border: 0; cursor: pointer;
  font: 600 14px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase;
  padding: 18px 24px; border-radius: 99px; background: var(--signal); color: var(--signal-ink);
  transition: transform .3s cubic-bezier(.2,.8,.2,1);
}
.btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); text-decoration: none; display: inline-block; }
.btn.ghost:hover { border-color: var(--fg); }
.socials { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px; }
footer { border-top: 1px solid var(--line); }
footer .wrap { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; padding-block: 24px calc(24px + env(safe-area-inset-bottom, 0px)); }

/* ---------- scroll reveals (resting state is fully visible) ---------- */
@supports (animation-timeline: view()) {
  .rise { animation: rise linear both; animation-timeline: view(); animation-range: entry 0% entry 70%; }
  @keyframes rise { from { transform: translateY(48px); opacity: .25; } to { transform: none; opacity: 1; } }
}

/* ---------- cursor ring ---------- */
.ring { position: fixed; left: 0; top: 0; width: 34px; height: 34px; margin: -17px 0 0 -17px; border: 1px solid var(--signal); border-radius: 50%; pointer-events: none; z-index: 70; opacity: 0; transition: width .3s, height .3s, margin .3s, opacity .3s, background .3s; mix-blend-mode: difference; }
.ring.on { opacity: 1; }
.ring.big { width: 72px; height: 72px; margin: -36px 0 0 -36px; background: color-mix(in srgb, var(--signal) 18%, transparent); }
@media (pointer: coarse) { .ring { display: none; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  html { scroll-behavior: auto; }
  .ring { display: none; }
}
</style>
</head>

    ]
  },
  experience: [
    { when: "Feb 2024 — Now", title: "Senior iOS Developer", org: "Lascade LLP", note: "Remote. Building and launching iOS apps from scratch, from architecture to features. Diagnosed production crashes with Sentry and built a scalable localization approach." },
    { when: "Jun 2019 — Oct 2023", title: "Software Engineer", org: "Fingent", note: "Kochi. Raised code consistency with SwiftLint and shared practices, and contributed to internal knowledge sharing for issue resolution." },
    { when: "Feb 2019 — Jun 2019", title: "iOS Developer Intern", org: "Fingent", note: "eCommerce payment integration, printers and payment terminals over CoreBluetooth and Wi-Fi, and fixes for legacy POS systems." }
  ],
  cta: ["Let's make", "something", "move."],
  email: "mushfiqhumayoon@gmail.com",
  socials: [["LinkedIn", "https://www.linkedin.com/in/mushfiqhumayoon"]]
};
/* ============================================================ */

const $ = (s, el = document) => el.querySelector(s);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const fine = matchMedia("(pointer: fine)").matches;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* ---------- render ---------- */
document.title = `${DATA.first} ${DATA.last}`;
$("#mark").innerHTML = `${esc(DATA.initials)}<span>.</span>`;
$("#status-text").textContent = DATA.status;
$("#location").textContent = DATA.location;
$("#edition").textContent = `Portfolio / ${new Date().getFullYear()}`;
$("#role-pre").textContent = DATA.rolePrefix;
$("#work-intro").textContent = DATA.workIntro;
$("#skills-intro").textContent = DATA.skillsIntro;
$("#email").textContent = DATA.email;
$("#foot-left").textContent = `© ${new Date().getFullYear()} ${DATA.first} ${DATA.last}`;

const nameEl = $("#name");
nameEl.setAttribute("aria-label", `${DATA.first} ${DATA.last}`);
let ci = 0;
nameEl.innerHTML = [DATA.first, DATA.last].map(w =>
  `<span class="row" aria-hidden="true">${[...w].map(c => `<span class="ch" style="--i:${ci++}">${esc(c)}</span>`).join("")}</span>`
).join("");

$("#swap").innerHTML = DATA.roleWords.map((w, i) => `<span class="${i ? "" : "on"}">${esc(w)}</span>`).join("");

$("#stats").innerHTML = DATA.stats.map(s =>
  `<div class="stat"><b><span data-count="${s.value}">${s.value}</span><em>${esc(s.suffix)}</em></b><span class="label">${esc(s.label)}</span></div>`
).join("");

const mItems = DATA.marquee.map(t => `<span>${esc(t)}</span>`).join("");
$("#m1").innerHTML = mItems.repeat(4);
$("#m2").innerHTML = [...DATA.marquee].reverse().map(t => `<span>${esc(t)}</span>`).join("").repeat(4);

const arrow = `<svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 13L13 3M13 3H5M13 3V11" stroke="currentColor" stroke-width="1.8"/></svg>`;
$("#projects").innerHTML = DATA.projects.map((p, i) => {
  const open = p.link ? `<a class="card rise ${p.size || ""}" href="${esc(p.link)}" target="_blank" rel="noopener">` : `<article class="card rise ${p.size || ""}">`;
  return `${open}
    <div class="art"><canvas data-motif="${esc(p.motif)}" data-seed="${i + 1}"></canvas><span class="label yr">${esc(p.kind)}</span>${p.link ? `<span class="go">${arrow}</span>` : ""}</div>
    <div class="meta">
      <span class="role-line">${esc(p.role)}</span>
      <h3>${esc(p.title)}</h3>
      <p>${esc(p.blurb)}</p>
      <div class="tags">${p.tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>
    </div>
  ${p.link ? "</a>" : "</article>"}`;
}).join("");

$("#skill-grid").innerHTML = DATA.skills.map(s => `
  <div class="skill">
    <h3>${esc(s.name)} <small>${esc(s.note)}</small></h3>
    <p>${esc(s.blurb)}</p>
    <ul>${s.items.map(([n, y]) => `<li>${esc(n)}<span>${esc(y)}</span></li>`).join("")}</ul>
  </div>`).join("");

$("#bio").innerHTML = `<p class="label" style="margin:0 0 24px">About</p><p class="lede">${DATA.bio.lede}</p>${DATA.bio.paras.map(p => `<p>${esc(p)}</p>`).join("")}`;

$("#timeline").innerHTML = DATA.experience.map(e => `
  <li><span class="when">${esc(e.when)}</span><h3>${esc(e.title)} <span>· ${esc(e.org)}</span></h3><p>${esc(e.note)}</p></li>`).join("");

$("#cta").innerHTML = DATA.cta.map((w, i) => `<span class="${i === DATA.cta.length - 1 ? "accent" : ""}">${esc(w)}</span>`).join(" ");

$("#socials").innerHTML = DATA.socials.map(([n, u]) => `<a class="btn ghost" href="${esc(u)}" target="_blank" rel="noopener">${esc(n)} ↗</a>`).join("");

/* ---------- copy email ---------- */
$("#copy").addEventListener("click", e => {
  const btn = e.currentTarget;
  const done = msg => { btn.textContent = msg; setTimeout(() => (btn.textContent = "Copy email"), 1800); };
  const fallback = () => { const r = document.createRange(); r.selectNodeContents($("#email")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); done("Selected, press ⌘C"); };
  try { navigator.clipboard.writeText(DATA.email).then(() => done("Copied"), fallback); } catch { fallback(); }
});

/* ---------- rotating role word ---------- */
if (!reduce) {
  const words = [...$("#swap").children];
  let w = 0;
  setInterval(() => {
    words[w].className = "off";
    const prev = w;
    w = (w + 1) % words.length;
    words[w].className = "on";
    setTimeout(() => { if (words[prev].className === "off") words[prev].className = ""; }, 650);
  }, 2400);
}

/* ---------- stat count-up (numbers are already correct at rest) ---------- */
if (!reduce) {
  document.querySelectorAll("[data-count]").forEach((el, i) => {
    const end = +el.dataset.count, t0 = performance.now() + 500 + i * 120, dur = 1400;
    const tick = now => {
      const t = Math.min(1, Math.max(0, (now - t0) / dur));
      el.textContent = Math.round(end * (1 - Math.pow(1 - t, 4)));
      if (t < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  });
}

/* ---------- name reacts to cursor ---------- */
const chars = [...nameEl.querySelectorAll(".ch")];
let centers = [];
const measure = () => { centers = chars.map(c => { const r = c.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2 + scrollY]; }); };
if (fine && !reduce) {
  setTimeout(measure, 1600);
  addEventListener("resize", measure);
  nameEl.closest(".hero").addEventListener("pointermove", e => {
    if (!centers.length) return;
    const maxW = innerWidth < 900 ? 112 : 132;
    chars.forEach((c, i) => {
      const dx = e.clientX - centers[i][0], dy = e.pageY - centers[i][1];
      const t = Math.max(0, 1 - Math.hypot(dx, dy) / 320);
      c.style.setProperty("--w", (100 + (maxW - 100) * t).toFixed(1));
      c.style.setProperty("--g", (780 + 120 * t).toFixed(0));
      c.classList.toggle("hot", t > .72);
    });
  });
  nameEl.closest(".hero").addEventListener("pointerleave", () => {
    chars.forEach(c => { c.style.setProperty("--w", 100); c.style.setProperty("--g", 780); c.classList.remove("hot"); });
  });
}

/* ---------- hero dot field ---------- */
const field = $("#field"), fx = field.getContext("2d");
let fw, fh, dpr, mouse = { x: -999, y: -999 }, heroVisible = true;
const sizeField = () => {
  dpr = Math.min(devicePixelRatio || 1, 2);
  fw = field.clientWidth; fh = field.clientHeight;
  field.width = fw * dpr; field.height = fh * dpr;
  fx.setTransform(dpr, 0, 0, dpr, 0, 0);
};
sizeField(); addEventListener("resize", sizeField);
field.parentElement.addEventListener("pointermove", e => { const r = field.getBoundingClientRect(); mouse.x = e.clientX - r.left; mouse.y = e.clientY - r.top; });
field.parentElement.addEventListener("pointerleave", () => { mouse.x = mouse.y = -999; });
new IntersectionObserver(([e]) => (heroVisible = e.isIntersecting)).observe(field);
const signal = getComputedStyle(document.documentElement).getPropertyValue("--signal").trim();
const drawField = t => {
  fx.clearRect(0, 0, fw, fh);
  const gap = fw < 600 ? 22 : 28;
  for (let y = gap / 2; y < fh; y += gap) {
    for (let x = gap / 2; x < fw; x += gap) {
      const wave = Math.sin(x * .012 + t * .0009) * Math.cos(y * .016 - t * .0007);
      let ox = 0, oy = wave * 6;
      const dx = x - mouse.x, dy = y - mouse.y, d = Math.hypot(dx, dy);
      let near = 0;
      if (d < 160) { near = 1 - d / 160; ox += dx / d * near * 22; oy += dy / d * near * 22; }
      const a = .08 + (wave + 1) * .07 + near * .6;
      fx.fillStyle = near > .15 ? signal : `rgba(232,235,242,${a.toFixed(3)})`;
      if (near > .15) fx.globalAlpha = Math.min(1, a);
      const s = 1.4 + near * 2.2;
      fx.fillRect(x + ox - s / 2, y + oy - s / 2, s, s);
      fx.globalAlpha = 1;
    }
  }
};

/* ---------- project motifs ---------- */
const arts = [...document.querySelectorAll(".art canvas")].map(cv => {
  const o = { cv, ctx: cv.getContext("2d"), motif: cv.dataset.motif, seed: +cv.dataset.seed, visible: false, speed: 1, target: 1 };
  const card = cv.closest(".card");
  card.addEventListener("pointerenter", () => (o.target = 2.6));
  card.addEventListener("pointerleave", () => { o.target = 1; card.style.setProperty("--rx", "0deg"); card.style.setProperty("--ry", "0deg"); });
  if (fine && !reduce) card.addEventListener("pointermove", e => {
    const r = card.getBoundingClientRect();
    card.style.setProperty("--ry", (((e.clientX - r.left) / r.width - .5) * 5).toFixed(2) + "deg");
    card.style.setProperty("--rx", (((e.clientY - r.top) / r.height - .5) * -5).toFixed(2) + "deg");
  });
  return o;
});
const sizeArt = o => {
  const r = o.cv.getBoundingClientRect();
  o.w = r.width; o.h = r.height;
  o.cv.width = o.w * dpr; o.cv.height = o.h * dpr;
  o.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
};
const ro = new ResizeObserver(entries => entries.forEach(en => { const o = arts.find(a => a.cv === en.target); if (o) { sizeArt(o); drawArt(o, o.clock || 0); } }));
const io = new IntersectionObserver(entries => entries.forEach(en => { const o = arts.find(a => a.cv === en.target); if (o) o.visible = en.isIntersecting; }));
arts.forEach(o => { ro.observe(o.cv); io.observe(o.cv); });

const FG = "232,235,242";
function drawArt(o, t) {
  const { ctx: c, w, h } = o;
  if (!w) return;
  c.clearRect(0, 0, w, h);
  const cx = w / 2, cy = h / 2, m = Math.min(w, h);
  c.lineCap = "round";
  switch (o.motif) {
    case "route": {
      const pts = [];
      for (let i = 0; i <= 160; i++) {
        const u = i / 160;
        pts.push([w * (.08 + u * .84), cy + Math.sin(u * 7 + 1) * h * .18 + Math.sin(u * 17) * h * .05]);
      }
      c.setLineDash([2, 7]); c.strokeStyle = `rgba(${FG},.25)`; c.lineWidth = 1.5;
      c.beginPath(); pts.forEach((p, i) => (i ? c.lineTo(...p) : c.moveTo(...p))); c.stroke(); c.setLineDash([]);
      const prog = (t * .00012) % 1.25, n = Math.min(pts.length - 1, Math.floor(prog * pts.length));
      c.strokeStyle = signal; c.lineWidth = 3;
      c.beginPath(); for (let i = 0; i <= n; i++) i ? c.lineTo(...pts[i]) : c.moveTo(...pts[i]); c.stroke();
      [0, 52, 104, 160].forEach(i => { c.fillStyle = i <= n ? signal : `rgba(${FG},.35)`; c.beginPath(); c.arc(...pts[i], 5, 0, 7); c.fill(); });
      const p = pts[n]; c.fillStyle = signal; c.globalAlpha = .25; c.beginPath(); c.arc(...p, 14 + Math.sin(t * .006) * 4, 0, 7); c.fill(); c.globalAlpha = 1;
      c.fillStyle = "#fff"; c.beginPath(); c.arc(...p, 4, 0, 7); c.fill();
      break;
    }
    case "bars": {
      const n = 28, bw = w * .8 / n;
      for (let i = 0; i < n; i++) {
        const v = .5 + .5 * Math.sin(i * .55 + t * .0016) * Math.cos(i * .21 - t * .0011);
        const bh = h * (.12 + v * .6), x = w * .1 + i * bw;
        c.fillStyle = i % 7 === 3 ? signal : `rgba(${FG},${(.15 + v * .45).toFixed(2)})`;
        c.fillRect(x + 2, h * .82 - bh, bw - 4, bh);
      }
      c.fillStyle = `rgba(${FG},.3)`; c.fillRect(w * .1, h * .82 + 6, w * .8, 1);
      break;
    }
    case "wave": {
      for (let k = 0; k < 14; k++) {
        c.beginPath();
        for (let x = 0; x <= w; x += 6) {
          const y = h * (.2 + k * .045) + Math.sin(x * .014 + t * .0018 + k * .4) * (10 + k * 1.6) * Math.sin(t * .0005 + k * .2);
          x ? c.lineTo(x, y) : c.moveTo(x, y);
        }
        c.strokeStyle = k === 6 ? signal : `rgba(${FG},${(.08 + k * .02).toFixed(2)})`;
        c.lineWidth = k === 6 ? 2.5 : 1.2; c.stroke();
      }
      break;
    }
    case "orbit": {
      for (let k = 1; k <= 5; k++) {
        const r = m * .07 * k, a = t * .0006 * (k % 2 ? 1 : -1.3) + k;
        c.strokeStyle = `rgba(${FG},.16)`; c.lineWidth = 1; c.beginPath(); c.arc(cx, cy, r, 0, 7); c.stroke();
        c.strokeStyle = k === 3 ? signal : `rgba(${FG},.7)`; c.lineWidth = 2.5; c.beginPath(); c.arc(cx, cy, r, a, a + 1.1); c.stroke();
        c.fillStyle = k === 3 ? signal : "#fff"; c.beginPath(); c.arc(cx + Math.cos(a + 1.1) * r, cy + Math.sin(a + 1.1) * r, 3.2, 0, 7); c.fill();
      }
      c.fillStyle = signal; c.beginPath(); c.arc(cx, cy, 5, 0, 7); c.fill();
      break;
    }
    case "grid": {
      const cols = 7, rows = 5, s = Math.min(w * .78 / cols, h * .78 / rows);
      const ox = cx - s * cols / 2, oy = cy - s * rows / 2;
      for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
        const ph = Math.sin(t * .0012 - (i + j) * .45);
        c.save(); c.translate(ox + s * (i + .5), oy + s * (j + .5)); c.rotate(ph * Math.PI / 4);
        const q = s * (.22 + (ph + 1) * .14);
        c.strokeStyle = (i + j * 3) % 11 === 4 ? signal : `rgba(${FG},${(.25 + (ph + 1) * .25).toFixed(2)})`;
        c.lineWidth = 1.5; c.strokeRect(-q, -q, q * 2, q * 2); c.restore();
      }
      break;
    }
    case "rings": {
      for (let k = 0; k < 9; k++) {
        const ph = (t * .00035 + k / 9) % 1, r = m * .05 + ph * m * .42;
        c.strokeStyle = k === 0 ? signal : `rgba(${FG},${(.5 * (1 - ph)).toFixed(2)})`;
        c.globalAlpha = k === 0 ? 1 - ph : 1;
        c.lineWidth = 1.5; c.beginPath(); c.ellipse(cx, cy, r * 1.3, r * .7, Math.sin(t * .0004) * .4, 0, 7); c.stroke();
      }
      c.globalAlpha = 1;
      break;
    }
  }
}

/* ---------- marquee driven by scroll velocity ---------- */
const tracks = [{ el: $("#m1"), x: 0, dir: -1 }, { el: $("#m2"), x: 0, dir: 1 }];
let lastY = scrollY, vel = 0;

/* ---------- cursor ring ---------- */
const ring = $("#ring");
let rx = -100, ry = -100, tx = -100, ty = -100;
if (fine && !reduce) {
  addEventListener("pointermove", e => { tx = e.clientX; ty = e.clientY; ring.classList.add("on"); });
  document.addEventListener("pointerleave", () => ring.classList.remove("on"));
  document.addEventListener("pointerover", e => ring.classList.toggle("big", !!e.target.closest("a, button, .head, .big")));
}

/* ---------- main loop ---------- */
let prev = performance.now();
function frame(now) {
  const dt = Math.min(50, now - prev); prev = now;
  if (heroVisible) drawField(now);
  arts.forEach(o => {
    o.speed += (o.target - o.speed) * .08;
    o.clock = (o.clock || 0) + dt * o.speed;
    if (o.visible) drawArt(o, o.clock);
  });
  vel += ((scrollY - lastY) - vel) * .1; lastY = scrollY;
  tracks.forEach(tr => {
    const half = tr.el.scrollWidth / 2;
    tr.x += tr.dir * (0.5 + Math.min(14, Math.abs(vel) * .35)) * dt / 16;
    if (tr.x <= -half) tr.x += half; if (tr.x > 0) tr.x -= half;
    tr.el.style.transform = `translateX(${tr.x}px)`;
  });
  rx += (tx - rx) * .2; ry += (ty - ry) * .2;
  ring.style.transform = `translate(${rx}px, ${ry}px)`;
  requestAnimationFrame(frame);
}
tracks[1].x = -200;
if (reduce) {
  drawField(0);
  requestAnimationFrame(() => arts.forEach(o => { sizeArt(o); drawArt(o, 4000); }));
} else {
  requestAnimationFrame(frame);
}

/* ---------- local clock in footer ---------- */
const clock = () => ($("#clock").textContent = `Local time ${new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}`);
clock(); setInterval(clock, 30000);
</script>
